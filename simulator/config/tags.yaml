plc:
  id: "S7-1200-SIM-001"
  name: "Siemens S7-1200 Simulator"
  endpoint: "opc.tcp://0.0.0.0:4840"
  modbus_port: 5020
  update_rate: 1.0
  
  simulation:
    enable_noise: true
    noise_level: 0.02
    enable_drift: true
    drift_rate: 0.001
    
  data_blocks:
    - db_number: 1
      name: "MotorControl"
      tags:
        - name: "Speed"
          address: "DB1.Speed"
          protocol: "opcua"
          opcua_node: "ns=2;i=3"
          type: "int"
          initial: 1500
          min: 0
          max: 3000
          unit: "rpm"
          access: "RW"
          generator: "random_walk"
          generator_params:
            step: 50
          
        - name: "Temperature"
          address: "DB1.Temperature"
          protocol: "opcua"
          opcua_node: "ns=2;i=5"
          type: "float"
          initial: 45.0
          min: 0
          max: 150
          unit: "°C"
          access: "RO"
          generator: "sine"
          generator_params:
            amplitude: 5
            period: 60
          
    - db_number: 2
      name: "PumpControl"
      tags:
        - name: "Pressure"
          address: "DB2.Pressure"
          protocol: "modbus"
          modbus_address: 40001
          modbus_type: "float32"
          type: "float"
          initial: 2.5
          min: 0
          max: 10
          unit: "bar"
          access: "RO"
          generator: "sine"
          generator_params:
            amplitude: 0.3
            period: 10
          
        - name: "Flow"
          address: "DB2.Flow"
          protocol: "modbus"
          modbus_address: 40003
          modbus_type: "float32"
          type: "float"
          initial: 100.0
          min: 0
          max: 200
          unit: "l/min"
          access: "RO"
          generator: "random_walk"
          generator_params:
            step: 5