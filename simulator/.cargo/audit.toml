# Настройки cargo audit для симулятора (CI: .github/workflows/audit.yml). Симулятор — стендовый инструмент,
# в образ шлюза не входит.
[advisories]
ignore = [
    # rsa 0.9 (Marvin Attack), приходит с async-opcua; исправленной версии нет. Симулятор предлагает защищённые
    # конечные точки (SIM_OPCUA_USER) только для проверки шлюза на стенде и не должен смотреть в недоверенную сеть.
    "RUSTSEC-2023-0071",
    # atomic-polyfill — заброшенный крейт, приходит через postcard/heapless серверной части async-opcua. Он нужен
    # лишь микроконтроллерам без атомарных операций; на x86_64/aarch64 не используется.
    "RUSTSEC-2023-0089",
]
