# ============================================================================
# Dependabot — PR на обновление зависимостей раз в неделю. PR проходят тот же CI
# (ci.yml: тесты, интеграционные против симулятора, сборка образа), поэтому «красное»
# обновление не влить. Уязвимости — отдельно: audit.yml и security updates Dependabot.
# ============================================================================
version: 2
updates:
  # ---- Rust: зависимости шлюза (Cargo.toml / Cargo.lock) ----
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Патчи совместимы по semver Cargo — одним PR.
      rust-patch:
        update-types: ["patch"]
      # Минорные у крейтов ≥ 1.0 тоже совместимы — одним PR. У 0.x минор ломающий
      # (async-opcua 0.19 → 0.20, rdkafka, mlua, sqlx, axum…) — такие приходят отдельными PR.
      rust-minor-stable:
        update-types: ["minor"]
        patterns: ["anyhow", "flate2", "serde", "serde_json", "thiserror", "tokio", "uuid", "tempfile"]

  # ---- Rust: PLC-симулятор и нагрузочный источник (отдельные пакеты со своими Cargo.lock) ----
  - package-ecosystem: "cargo"
    directories: ["/simulator", "/loadtest/loadsim"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-patch:
        update-types: ["patch"]

  # ---- GitHub Actions: версии экшенов в workflow — одним PR ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # ---- Docker: базовые образы Dockerfile'ов ----
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker"
    directory: "/simulator"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"

  # ---- Docker Compose: образы стенда (kafka, postgres) ----
  # Версию Kafka в services.kafka CI (ci.yml) держать такой же — его Dependabot не видит.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Мажор PostgreSQL несовместим с томом данных pgdata (нужен pg_upgrade/дамп) — вручную.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
