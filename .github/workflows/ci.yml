# ============================================================================
# CI/CD Rust-шлюза.
#   На каждый push и PR: форматирование, clippy (предупреждения = ошибки), тесты.
#   На push в main и теги vX.Y.Z: образ публикуется в GHCR.
# ============================================================================
name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  check:
    name: Rust fmt, clippy & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # librdkafka 2.12 включает curl/curl.h даже при выключенном curl: в config.h
      # WITH_OAUTHBEARER_OIDC определён всегда (cmakedefine01), а проверка — #ifdef.
      # Нужны только заголовки; линковки с libcurl нет.
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Кэш ~/.cargo и target: librdkafka и Lua собираются из исходников, без кэша
      # это несколько минут на каждый прогон.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  # Python-тесты PLC-симулятора (simulator/): реплей архива, регистры Modbus, PAC-сервер.
  simulator:
    name: Simulator tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      # Python 3.11: asyncua 1.1.8 на 3.14 не работает (баг клиента).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: simulator/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  # Интеграционные тесты (#[ignore] в обычном cargo test): клиенты протоколов и шлюз
  # целиком против своего PLC-симулятора (simulator/), Kafka и Postgres.
  integration:
    name: Integration tests (simulator + Kafka + Postgres)
    needs: [check, simulator]
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:latest      # KRaft, одна нода, PLAINTEXT localhost:9092
        ports: [ "9092:9092" ]
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scada_it
          POSTGRES_USER: scada_user
          POSTGRES_PASSWORD: scada_password
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U scada_user -d scada_it"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: simulator/requirements.txt

      - name: Start PLC simulator
        working-directory: simulator
        run: |
          pip install -q -r requirements.txt
          OPCUA_ENDPOINT=opc.tcp://127.0.0.1:4840 nohup python simulator.py config/replay_config.yaml > "$RUNNER_TEMP/simulator.log" 2>&1 &
          for port in 4840 5020 10000; do
            for i in $(seq 60); do (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null && break; sleep 1; done
          done
          for i in $(seq 60); do (echo > /dev/tcp/127.0.0.1/9092) 2>/dev/null && break; sleep 1; done
          tail -3 "$RUNNER_TEMP/simulator.log"

      - name: Integration tests
        env:
          SIM_HOST: 127.0.0.1
          KAFKA_BOOTSTRAP: localhost:9092
          IT_DATABASE_URL: jdbc:postgresql://localhost:5432/scada_it
        run: cargo test --locked -- --ignored

      - name: Logs on failure
        if: failure()
        run: |
          echo "=== simulator ==="; tail -50 "$RUNNER_TEMP/simulator.log" || true
          for f in /tmp/scada-gateway-it-*.log; do echo "=== $f ==="; tail -80 "$f"; done || true

  docker:
    name: Build & publish image (GHCR)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # право публиковать пакет в GHCR через GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7

      # На PR образ только собирается (проверка Dockerfile), публикуется на push.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Теги образа:
      #   main       → :latest (+ :<sha>)
      #   тег vX.Y.Z → :vX.Y.Z (+ :<sha>)
      #   PR         → :ci-<sha> (не публикуется)
      # Имя в GHCR — только строчными (EuZireael/SCADA_rust → euzireael/scada_rust).
      - name: Compute image tags
        id: meta
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          case "${{ github.ref }}" in
            refs/heads/main) TAGS="$IMAGE:latest $IMAGE:${{ github.sha }}" ;;
            refs/tags/v*)    TAGS="$IMAGE:${{ github.ref_name }} $IMAGE:${{ github.sha }}" ;;
            *)               TAGS="$IMAGE:ci-${{ github.sha }}" ;;
          esac
          ARGS=""; for t in $TAGS; do ARGS="$ARGS -t $t"; done
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build ${{ steps.meta.outputs.args }} .

      - name: Push image
        if: github.event_name == 'push'
        run: docker push -a ${{ steps.meta.outputs.image }}
