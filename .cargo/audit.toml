# Настройки cargo audit (CI: .github/workflows/audit.yml). Исключения — только с обоснованием.
[advisories]
ignore = [
    # rsa 0.9 (Marvin Attack: утечка ключа по времени RSA-расшифровки), приходит с async-opcua. Исправленной версии
    # нет. Затрагивает только защищённый канал OPC UA (политики Basic256Sha256 и подобные): при политике None
    # RSA-расшифровки приватным ключом нет. Для атаки нужно быть между шлюзом и ПЛК и слать шлюзу много
    # специально составленных ответов, замеряя время реакции; цель — закрытый ключ клиентского сертификата шлюза
    # (самоподписанный, лежит в GATEWAY_OPCUA_PKI_DIR). Сеть ПЛК изолирована, поэтому риск принят; снижают его
    # `trusted/` вместо GATEWAY_OPCUA_TRUST_SERVER_CERTS и замена сертификата шлюза после подозрительного
    # вмешательства в сеть. Пересмотреть, когда async-opcua перейдёт на исправленную версию rsa.
    "RUSTSEC-2023-0071",
]
